name: Build private inference images

on:
  workflow_dispatch:
  push:
    paths:
      - container/**
      - container-llama-cpp/**
      - .github/workflows/container.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vllm
            context: container
          - name: llama-cpp
            context: container-llama-cpp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/opencode-private-${{ matrix.name }}
          tags: type=sha,prefix=
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Check llama.cpp server flags
        if: matrix.name == 'llama-cpp'
        run: |
          docker run --rm --entrypoint /app/llama-server "${{ steps.meta.outputs.tags }}" --help > /tmp/llama-server-help
          grep -F -- '--fit' /tmp/llama-server-help
          grep -F -- '--no-mmproj' /tmp/llama-server-help
          grep -F -- '--metrics' /tmp/llama-server-help
          grep -F -- '--no-cache-prompt' /tmp/llama-server-help
          grep -F -- '--cache-ram' /tmp/llama-server-help
          grep -F -- '--no-slots' /tmp/llama-server-help
          grep -F -- '--log-disable' /tmp/llama-server-help
      - name: Check unprivileged inference user
        run: |
          test "$(docker run --rm --entrypoint gosu "${{ steps.meta.outputs.tags }}" inference id -u)" != 0
      - name: Check clinical vLLM isolation
        if: matrix.name == 'vllm'
        run: |
          set -euo pipefail
          test_root=$(mktemp -d)
          cat > "$test_root/fake-vllm" <<'SCRIPT'
          #!/bin/sh
          printf 'uid=%s\n' "$(id -u)"
          touch "$HF_HOME/write-test"
          rm "$HF_HOME/write-test"
          printf 'ephemeral_cache_writable=yes\n'
          SCRIPT
          chmod 0755 "$test_root/fake-vllm"
          output=$(docker run --rm \
            -e CLINICAL_MODE=1 \
            -e MODEL_CACHE_DIR=/var/lib/opencode-gpu/huggingface \
            -v "$test_root/fake-vllm:/usr/local/bin/vllm:ro" \
            "${{ steps.meta.outputs.tags }}")
          grep -E 'uid=[1-9][0-9]*' <<< "$output"
          grep -F 'ephemeral_cache_writable=yes' <<< "$output"
      - name: Check clinical llama.cpp isolation
        if: matrix.name == 'llama-cpp'
        run: |
          set -euo pipefail
          test_root=$(mktemp -d)
          workspace="$test_root/workspace"
          mkdir -p "$workspace/llama.cpp"
          printf 'public test model\n' > "$workspace/llama.cpp/model.gguf"
          printf 'stale partial\n' > "$workspace/llama.cpp/model.gguf.partial"
          model_sha=$(sha256sum "$workspace/llama.cpp/model.gguf" | cut -d ' ' -f 1)
          cat > "$test_root/fake-server" <<'SCRIPT'
          #!/bin/sh
          printf 'uid=%s\n' "$(id -u)"
          if test -w /workspace; then
            printf 'workspace_writable=yes\n'
            exit 90
          fi
          printf 'workspace_writable=no\n'
          on_term() {
            sleep 2
            if test -e /workspace/runtime-canary; then
              printf 'canary_present_during_child_stop=yes\n' > /test-output/child-stop
            else
              printf 'canary_present_during_child_stop=no\n' > /test-output/child-stop
            fi
            exit 0
          }
          trap on_term TERM INT
          while :; do sleep 1; done
          SCRIPT
          chmod 0755 "$test_root/fake-server"
          mkdir "$test_root/output"
          chmod 0777 "$test_root/output"
          docker run -d --name clinical-llama-test \
            -e CLINICAL_MODE=1 \
            -e MODEL_CACHE_DIR=/workspace/llama.cpp \
            -e MODEL_FILE=model.gguf \
            -e MODEL_SHA256="$model_sha" \
            -v "$workspace:/workspace" \
            -v "$test_root/fake-server:/app/llama-server:ro" \
            -v "$test_root/output:/test-output" \
            "${{ steps.meta.outputs.tags }}"
          trap 'docker rm -f clinical-llama-test clinical-llama-reject >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            docker logs clinical-llama-test 2>&1 | grep -F 'workspace_writable=no' && break
            sleep 1
          done
          docker logs clinical-llama-test 2>&1 | grep -E 'uid=[1-9][0-9]*'
          docker logs clinical-llama-test 2>&1 | grep -F 'workspace_writable=no'
          test ! -e "$workspace/llama.cpp/model.gguf.partial"
          sudo chmod 0755 "$workspace"
          printf 'synthetic runtime file\n' | sudo tee "$workspace/runtime-canary" >/dev/null
          docker stop -t 10 clinical-llama-test
          grep -F 'canary_present_during_child_stop=yes' "$test_root/output/child-stop"
          test ! -e "$workspace/runtime-canary"
          docker rm clinical-llama-test
          sudo chmod 0755 "$workspace" "$workspace/llama.cpp"
          printf 'do not delete\n' | sudo tee "$workspace/unexpected" >/dev/null
          if docker run --name clinical-llama-reject \
              -e CLINICAL_MODE=1 \
              -e MODEL_CACHE_DIR=/workspace/llama.cpp \
              -e MODEL_FILE=model.gguf \
              -e MODEL_SHA256="$model_sha" \
              -v "$workspace:/workspace" \
              -v "$test_root/fake-server:/app/llama-server:ro" \
              "${{ steps.meta.outputs.tags }}"; then
            printf 'Clinical mode accepted unexpected volume content.\n' >&2
            exit 1
          fi
          test -e "$workspace/unexpected"
          docker rm clinical-llama-reject
          trap - EXIT
